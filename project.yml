name: MoneyTrax
options:
  bundleIdPrefix: com.rysun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""

packages:
  SammatiNoticeSDK:
    path: "../../conveygrid-ios-sdk"

targets:
  MoneyTrax:
    type: application
    platform: iOS
    dependencies:
      - package: SammatiNoticeSDK
    sources:
      - path: MoneyTrax
        excludes:
          - "*.xcprivacy"
    resources:
      - path: MoneyTrax/Resources/Assets.xcassets
      - path: MoneyTrax/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rysun.dailyexpensetracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "MoneyTrax"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"

  MoneyTraxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyTraxTests
    dependencies:
      - target: MoneyTrax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rysun.dailyexpensetrackerTests
        GENERATE_INFOPLIST_FILE: YES
